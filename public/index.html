<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3864">
  <title>Family Calendar</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calendar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231f3864'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>C</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261012152516">
  <script>try{var t=JSON.parse(localStorage.getItem("cal.theme"));if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <div class="bar" id="bar">
  <header class="top">
    <h1>Family Calendar</h1>
    <div class="top-r"><button id="search" class="today-btn" title="Search all entries" aria-label="Search">🔍</button><button id="today" class="today-btn" title="Jump to today">Today</button><span id="me" class="me"></span><button id="theme" class="theme-btn"></button></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="month" class="active">Month</button>
    <button data-view="upcoming">Upcoming</button>
    <button data-view="birthdays">Birthdays</button>
    <button data-view="school">School</button>
    <button data-view="log">Changes</button>
    <button data-view="info" hidden>🔒 Info</button>
    <button data-view="setup" hidden>⚙ Setup</button>
  </nav>

  <div class="filters" id="filters"></div>
  </div>

  <main id="main"><p class="muted pad">Loading…</p></main>

  <button class="fab" id="fab" aria-label="Add event">+</button>

  <dialog id="dlg"><div id="dlg-body"></div></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script src="rules.js?v=20261012152516"></script>
  <script src="app.js?v=20261012152516"></script>
  <script src="grid.js?v=20261012152516"></script>
</body>
</html>

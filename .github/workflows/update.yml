# Update this calendar to the latest Family Calendar release. Runs by itself every night (03:17 South African time) and
# whenever you click GitHub > Actions > "Update Family Calendar" > Run workflow. Nothing new = nothing changes.
# Cloudflare rebuilds the calendar by itself a minute later (and applies any database changes).
# Your calendar's entries and settings are not touched - they live in your Cloudflare database. Any changes YOU made to the
# code are replaced (that's the deal: an update gives you exactly the released version). Your wrangler.toml keeps its own
# Worker name, database name and database ID.
name: Update Family Calendar
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace the code with the latest release
        env:
          UPSTREAM: jrseggie/family-calendar
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # which release is newest: GitHub's API (signed in, so GitHub's shared machines don't hit its limit for anonymous
          # requests), tried 3 times; if that still fails, the releases page itself, which jumps to the newest one
          tag=$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$UPSTREAM/releases/latest" | jq -r .tag_name || true)
          if [ -z "$tag" ] || [ "$tag" = null ]; then
            tag=$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' "https://github.com/$UPSTREAM/releases/latest" | sed 's|.*/tag/||')
          fi
          case "$tag" in v[0-9]*) ;; *) echo "Couldn't find the latest release ($tag)"; exit 1 ;; esac
          echo "Latest release: $tag"
          mkdir -p /tmp/new && curl -fsSL "https://github.com/$UPSTREAM/archive/refs/tags/$tag.tar.gz" | tar xz -C /tmp/new --strip-components=1
          cp wrangler.toml /tmp/old-wrangler.toml
          # everything from the release, except this repository's history and its own workflows (GitHub doesn't let
          # an action change workflow files - if the update action itself changes, the release notes say how to replace it)
          rsync -a --delete --exclude .git --exclude .github /tmp/new/ ./
          cmp -s /tmp/new/.github/workflows/update.yml .github/workflows/update.yml \
            || echo "::notice::This update job itself has a newer version - see docs/HELP.md, Updates (replace update.yml)"
          # keep this calendar's own Worker name, database name and database ID
          for key in name database_name database_id; do
            line=$(grep -m1 -E "^$key *=" /tmp/old-wrangler.toml || true)
            [ -n "$line" ] && sed -i -E "0,/^$key *=.*/s||$line|" wrangler.toml
          done
          git config user.name "Family Calendar updater"
          git config user.email "updater@users.noreply.github.com"
          git add -A
          git commit -m "Update to Family Calendar $tag" || { echo "Already up to date"; exit 0; }
          git push
